<!-- E-mail com o código de acesso ao INCFlow (decisão 50). Usado no step de envio do carteiro (Pipedream).
     No Pipedream, troque {{nome}} e {{codigo}} por {{steps.validar_envio.$return_value.nome}} e
     {{steps.validar_envio.$return_value.codigo}}. Sem link de login: link em e-mail ensina a clicar em phishing. -->
<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:0;background:#f4f6f5;font-family:Arial,Helvetica,sans-serif;color:#0f2229;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f5;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:16px;border:1px solid #dfe5e3;">
            <tr>
              <td style="background:#0d1f24;border-radius:16px 16px 0 0;padding:20px 28px;color:#ffffff;font-size:20px;font-weight:bold;">INCFlow</td>
            </tr>
            <tr>
              <td style="padding:28px;">
                <p style="margin:0 0 16px;font-size:15px;">Olá, {{nome}}.</p>
                <p style="margin:0 0 20px;font-size:15px;line-height:1.5;">Use este código para entrar no INCFlow:</p>
                <p style="margin:0 0 20px;text-align:center;font-size:34px;font-weight:bold;letter-spacing:10px;font-family:'Courier New',monospace;color:#0d1f24;background:#f4f6f5;border-radius:12px;padding:16px 0;">{{codigo}}</p>
                <p style="margin:0 0 8px;font-size:14px;color:#4b5f63;">O código vale por <strong>10 minutos</strong> e só pode ser usado uma vez.</p>
                <p style="margin:0;font-size:14px;color:#4b5f63;">Se não foi você que pediu, ignore este e-mail: ninguém entra sem o código.</p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;font-size:12px;color:#7b8c8f;">E-mail automático. Não responda.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
